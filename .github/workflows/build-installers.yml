name: 构建安装包（全平台）

# 目的：出「同事可直接双击安装」的安装包，三份：
#   · Windows 安装包 .exe（NSIS）
#   · macOS Apple Silicon .dmg（arm64）
#   · macOS Intel .dmg（x64）
# 为什么必须在对应系统上构建：Tauri 的 Windows 产物需要 MSVC、macOS 产物需要 Xcode 工具链，无法交叉编译。
#
# 产物已内嵌：Node 运行时（engine/node-bin/）+ 引擎 + 端口词典
# 同事机器无需装 Node / Chrome —— 没有 Chrome 时引擎会自动下载一份 Chrome for Testing。

on:
  workflow_dispatch:            # 手动触发（Actions 页面点一下）
  push:
    tags: ['v*']                # 打 tag 自动出包并挂到 Release

permissions:
  contents: write               # 打 tag 时创建 Release 需要

env:
  NODE_VERSION: '22.23.3'       # 内嵌进包的 Node 版本（需 ≥ 22.5，node:sqlite 要求）

jobs:
  # ─────────────────────────── Windows ───────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 装依赖（前端 + 引擎）
        run: |
          npm ci
          npm ci --prefix engine

      - name: 下载 Node 运行时（随包分发 → 同事机器零依赖）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path engine/node-bin | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$env:NODE_VERSION/win-x64/node.exe" -OutFile engine/node-bin/node.exe
          $f = Get-Item engine/node-bin/node.exe
          Write-Host "node.exe: $([math]::Round($f.Length/1MB,1)) MB"
          & engine/node-bin/node.exe --version

      - name: 构建安装包（NSIS）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      - name: 产物清单
        shell: pwsh
        run: Get-ChildItem src-tauri/target/release/bundle/nsis/ | Format-Table Name, Length

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  # ─────────────────────────── macOS ───────────────────────────
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            nodearch: arm64
            name: mac-arm64
          - target: x86_64-apple-darwin
            nodearch: x64
            name: mac-intel
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 装 Rust（含交叉目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 装依赖（前端 + 引擎）
        run: |
          npm ci
          npm ci --prefix engine

      - name: 下载 Node 运行时（随包分发 → 同事机器零依赖）
        run: |
          mkdir -p engine/node-bin
          curl -fsSL --retry 2 -o /tmp/node.tar.gz "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-darwin-${{ matrix.nodearch }}.tar.gz"
          tar -xzf /tmp/node.tar.gz -C /tmp
          cp "/tmp/node-v${{ env.NODE_VERSION }}-darwin-${{ matrix.nodearch }}/bin/node" engine/node-bin/node
          chmod +x engine/node-bin/node
          ls -lh engine/node-bin/node
          engine/node-bin/node --version

      - name: 构建 dmg（${{ matrix.name }}）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg,app

      - name: 整理更新包（重命名避免两架构重名）
        run: |
          cd "src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          V=$(node -p "require('/Users/runner/work/ship-schedule-hub/ship-schedule-hub/package.json').version" 2>/dev/null || echo "0.0.0")
          if [ -f ShipScheduleHub.app.tar.gz ]; then
            cp ShipScheduleHub.app.tar.gz "ShipScheduleHub_${V}_${{ matrix.nodearch }}.app.tar.gz"
            cp ShipScheduleHub.app.tar.gz.sig "ShipScheduleHub_${V}_${{ matrix.nodearch }}.app.tar.gz.sig"
          fi
          ls -lh

      - name: 产物清单
        run: ls -lh "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-dmg
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # ─────────────────────── 打 tag 时发 Release ───────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: 收集全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 清单
        run: ls -lh dist/

      - name: 生成 latest.json（App 内更新清单）
        run: |
          V="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/theWeatherMan21/ship-schedule-hub/releases/download/v${V}"
          python3 - "$V" "$BASE" <<'PYEOF'
          import json, os, sys, glob
          v, base = sys.argv[1], sys.argv[2]
          plats = {}
          def sig_of(name):
              for f in glob.glob('dist/**/' + name + '.sig', recursive=True) + glob.glob('dist/' + name + '.sig'):
                  return open(f).read().strip()
              return None
          # macOS
          for arch, key in (('aarch64', 'darwin-aarch64'), ('x64', 'darwin-x86_64')):
              fn = f'ShipScheduleHub_{v}_{arch}.app.tar.gz'
              s = sig_of(fn)
              if s:
                  plats[key] = {'signature': s, 'url': f'{base}/{fn}'}
          # Windows（NSIS 的 updater 产物就是 setup.exe）
          for f in glob.glob('dist/**/*setup.exe', recursive=True):
              fn = os.path.basename(f)
              s = sig_of(fn)
              if s:
                  plats['windows-x86_64'] = {'signature': s, 'url': f'{base}/{fn}'}
          out = {'version': v, 'pub_date': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'platforms': plats}
          json.dump(out, open('latest.json', 'w'), indent=2, ensure_ascii=False)
          print('latest.json:\n', json.dumps(out, indent=2)[:600])
          print('平台数:', len(plats))
          PYEOF

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            latest.json
          generate_release_notes: true
          body: |
            船期聚合驾驶舱 · ShipScheduleHub

            **一键并发查 11 家船司船期**（阳明 / MSC / 马士基 / ONE / 中远 / 赫伯罗特 / 以星 / 达飞 / 长荣 / 东方海外 / 现代）。

            | 系统 | 下载哪个 |
            |---|---|
            | Windows 10/11 | `*_x64-setup.exe` |
            | Mac（M 系列芯片） | `*_aarch64.dmg` |
            | Mac（Intel 芯片） | `*_x64.dmg` |

            **安装说明**
            1. 下载对应安装包，双击安装 —— **不需要**预先安装 Node.js 或 Chrome。
            2. 首次查询若机器上没有 Chrome，程序会自动下载一份浏览器内核（约 150MB，只下一次），
               这段时间查询会慢一点，之后恢复正常。
            3. macOS 若提示「无法验证开发者」：右键点图标 →「打开」→ 再点「打开」即可（内部工具未做签名）。
            4. Windows 若弹 SmartScreen：点「更多信息」→「仍要运行」。

            用法：填「起运港 + 目的港」（日期可留空 = 用官网默认），点查询，等 1 分钟看 11 家结果。
